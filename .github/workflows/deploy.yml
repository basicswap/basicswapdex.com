# Builds the Astro site and publishes it to GitHub Pages.
#
# The whole site lives in this repository: the pages, the blog
# (src/content/blog) and the docs (src/content/docs). A push that changes any
# of them deploys all of it.
#
# Runs on every push to main, once a day (so build-time data such as the
# latest release version stays fresh), and on demand from the Actions tab.
# A broken internal link fails the build before anything is published.
#
# Before the first run: repository Settings -> Pages -> Source must be
# "GitHub Actions" instead of "Deploy from a branch".
#
# Actions are pinned to commit SHAs; the comment gives the release tag.

name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: sitemap lastmod comes from git dates

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # every internal link and #anchor across pages, blog and docs, plus
      # docs descriptions, headings and share cards
      - run: npm run check:links

      # every basicswap-prepare option and bsx-* command the docs name still exists
      - run: npm run check:docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
